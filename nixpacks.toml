[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
paths = ["/opt/venv/bin"]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r backend/requirements.txt",
  "cd frontend && npm install"
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "uvicorn backend.api:app --host 0.0.0.0 --port $PORT"
